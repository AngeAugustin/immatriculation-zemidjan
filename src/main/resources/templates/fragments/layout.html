<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      class="h-100">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
</head>
<body class="d-flex flex-column h-100">
    <!-- Layout principal avec header, content, et footer -->
    <th:block th:fragment="main-layout(content)">
        <!-- Header avec navigation -->
        <th:block th:replace="~{fragments/header :: nav}"></th:block>
        
        <!-- Contenu principal -->
        <main class="flex-shrink-0">
            <div class="container mt-4 mb-4">
                <!-- Affichage des messages flash -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-2"></i> <span th:text="${warningMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i> <span th:text="${infoMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <!-- Contenu spécifique de la page -->
                <th:block th:replace="${content}"></th:block>
            </div>
        </main>
        
        <!-- Footer -->
        <th:block th:replace="~{fragments/footer :: footer}"></th:block>
        
        <!-- Scripts -->
        <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
    </th:block>
</body>
</html>
