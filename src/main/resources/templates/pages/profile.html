<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
</head>
<body class="d-flex flex-column h-100">
    <th:block th:replace="~{fragments/layout :: main-layout(~{::section})}">
        <section>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="border-bottom pb-2"><i class="bi bi-person-circle"></i> Mon Profil</h2>
                <div>
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Retour au tableau de bord
                    </a>
                </div>
            </div>
            
            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-light">
                            <h5 class="mb-0">Informations personnelles</h5>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <h6>Nom:</h6>
                                    <p th:text="${user.nom}">Nom</p>
                                </div>
                                <div class="col-md-6">
                                    <h6>Prénom:</h6>
                                    <p th:text="${user.prenom}">Prénom</p>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <h6>Email:</h6>
                                    <p th:text="${user.email}">email@example.com</p>
                                </div>
                                <div class="col-md-6">
                                    <h6>Commune:</h6>
                                    <p th:text="${user.commune}">Commune</p>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <h6>Rôles:</h6>
                                <div>
                                    <span th:each="role : ${user.roles}" class="me-2">
                                        <span th:if="${role.name.name() == 'ROLE_ADMIN'}" class="badge bg-danger">Administrateur</span>
                                        <span th:if="${role.name.name() == 'ROLE_MODERATEUR'}" class="badge bg-warning text-dark">Modérateur</span>
                                        <span th:if="${role.name.name() == 'ROLE_USER'}" class="badge bg-info text-white">Utilisateur</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-header bg-light">
                            <h5 class="mb-0">Changer de mot de passe</h5>
                        </div>
                        <div class="card-body">
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle-fill me-2"></i>
                                La fonctionnalité de changement de mot de passe sera disponible prochainement.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
