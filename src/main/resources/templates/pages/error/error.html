<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
</head>
<body class="d-flex flex-column h-100">
    <th:block th:replace="~{fragments/layout :: main-layout(~{::section})}">
        <section>
            <div class="text-center my-5">
                <h1 class="display-1 text-warning" th:text="${status}">Erreur</h1>
                <h2 class="mb-4" th:text="${error}">Une erreur s'est produite</h2>
                <p class="lead mb-4" th:text="${message}">
                    Nous sommes désolés, mais une erreur s'est produite.
                </p>
                <p th:if="${timestamp}" class="text-muted mb-4">
                    <small>Timestamp: <span th:text="${timestamp}">Timestamp</span></small>
                </p>
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-house-door"></i> Retourner au tableau de bord
                </a>
            </div>
        </section>
    </th:block>
</body>
</html>
