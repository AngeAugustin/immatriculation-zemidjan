<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
</head>
<body class="d-flex flex-column h-100">
    <th:block th:replace="~{fragments/layout :: main-layout(~{::section})}">
        <section>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card mt-5 shadow-sm">
                        <div class="card-header bg-danger text-white">
                            <h3 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Erreur système</h3>
                        </div>
                        <div class="card-body">
                            <div class="alert alert-danger" th:if="${errorMessage}">
                                <p th:text="${errorMessage}">Message d'erreur</p>
                            </div>
                            <div class="alert alert-danger" th:unless="${errorMessage}">
                                <p>Une erreur inattendue s'est produite. Veuillez réessayer plus tard.</p>
                            </div>
                            <p>Si le problème persiste, veuillez contacter l'administrateur système.</p>
                            <div class="d-grid gap-2 mt-4">
                                <a th:href="@{/dashboard}" class="btn btn-primary">
                                    <i class="bi bi-house-door"></i> Retour au tableau de bord
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
