<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
</head>
<body class="d-flex flex-column h-100">
    <th:block th:replace="~{fragments/layout :: main-layout(~{::section})}">
        <section>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white text-center">
                            <h4 class="my-2"><i class="bi bi-box-arrow-in-right"></i> Connexion</h4>
                        </div>
                        <div class="card-body p-4">
                            <div th:if="${param.error}" class="alert alert-danger">
                                <i class="bi bi-exclamation-triangle-fill"></i> Email ou mot de passe incorrect.
                            </div>
                            <div th:if="${param.logout}" class="alert alert-success">
                                <i class="bi bi-check-circle-fill"></i> Vous avez été déconnecté avec succès.
                            </div>
                            
                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="username" name="username" 
                                               placeholder="Votre adresse email" required autofocus>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label">Mot de passe</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="password" name="password" 
                                               placeholder="Votre mot de passe" required>
                                    </div>
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                                    <label class="form-check-label" for="rememberMe">Se souvenir de moi</label>
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-box-arrow-in-right"></i> Se connecter
                                    </button>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer text-center py-3">
                            <div>Vous n'avez pas de compte ? <a th:href="@{/register}" class="text-decoration-none">S'inscrire</a></div>
                            <div class="mt-2"><a href="#" class="text-decoration-none">Mot de passe oublié ?</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
